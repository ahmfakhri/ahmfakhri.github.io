<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pengajuan Penjemputan Sampah</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Platform Penjemputan Sampah Anorganik Terpilah</h1>
    </header>

    <nav>
        <a href="index.html">Beranda</a>
        <a href="pengajuan.html">Pengajuan Penjemputan</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>

    <main class="form-container">

        <h2>Form Pengajuan Penjemputan Sampah</h2>

        <p>
            Silakan isi data pengajuan penjemputan sampah anorganik
            yang telah Anda pilah.
        </p>

        <form action="#" method="post" enctype="multipart/form-data">

            <div class="form-group">
                <label for="nama">Nama Pengguna:</label>

                <input
                    class="input-control"
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama Anda"
                    required
                >
            </div>

            <div class="form-group">
                <label for="jenis_sampah">Jenis Sampah:</label>

                <select
                    class="input-control"
                    id="jenis_sampah"
                    name="jenis_sampah"
                    required
                >
                    <option value="">-- Pilih Jenis Sampah --</option>
                    <option value="plastik">Plastik</option>
                    <option value="kertas">Kertas</option>
                    <option value="kardus">Kardus</option>
                    <option value="logam">Logam</option>
                </select>
            </div>

            <div class="form-group">
                <label for="jumlah">Perkiraan Jumlah:</label>

                <input
                    class="input-control"
                    type="number"
                    id="jumlah"
                    name="jumlah"
                    placeholder="Contoh: 5 kg"
                    required
                >
            </div>

            <div class="form-group">
                <label for="lokasi">Lokasi Penjemputan:</label>

                <input
                    class="input-control"
                    type="text"
                    id="lokasi"
                    name="lokasi"
                    placeholder="Masukkan lokasi penjemputan"
                    required
                >
            </div>

            <div class="form-group">
                <label for="bukti">Foto Sampah:</label>

                <input
                    class="input-control"
                    type="file"
                    id="bukti"
                    name="bukti"
                    accept="image/*"
                    required
                >
            </div>

            <div class="form-group">
                <label for="catatan">Catatan:</label>

                <textarea
                    class="input-control"
                    id="catatan"
                    name="catatan"
                    placeholder="Tambahkan catatan jika diperlukan"
                    rows="4"
                ></textarea>
            </div>

            <button type="submit" id="btn-submit">
                Ajukan Penjemputan
            </button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Platform Penjemputan Sampah Anorganik Terpilah</p>
    </footer>

</body>
</html>
